<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trial Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: collapsible left rail (env-tinted) | blueprint workspace | agent panel. Custom-app family skin on VDS. */
:root{
  color-scheme:dark;
  --page:#070D18; --rail:#0A1322; --rail-border:#182740;
  --card:#0E1A2B; --card-border:#1E2F4A; --pill:#13233A; --pill-border:#27395A; --hover:#162842; --row:#112036;
  --text:#E7EAF0; --text2:#C9D0DA; --label:#A3ACBA; --muted:#7F8897; --link:#AEB8FF; --focus:#5AA9F0;
  --primary:#2269E9; --primary-text:#fff; --blue-wash:rgba(76,124,240,.20); --blue-text:#B4C8FF;
  --green:#4CC38A; --green-text:#7DDBAE; --green-wash:rgba(76,195,138,.16);
  --amber:#F0B35E; --amber-text:#F5C98A; --amber-wash:rgba(240,179,94,.18);
  --red:#F2645A; --red-text:#FF9B93; --red-wash:rgba(242,100,90,.18);
  --purple:#B080FC; --purple-text:#CDB0FF; --purple-wash:rgba(176,128,252,.18);
  --rd-tint:#0B1A33; --val-tint:#171230;
  --code:#09121F;
  --f-ui:"Inter Tight",Inter,system-ui,sans-serif; --f-title:"Noto Serif",Georgia,serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --page:#F1F3F4; --rail:#F7F8FA; --rail-border:#E3E6EA; --card:#FFFFFF; --card-border:#E3E6EA; --pill:#F4F6F9; --pill-border:#D5DBE3; --hover:#EEF2F8; --row:#F7F9FC;
  --text:#0B1220; --text2:#2C3646; --label:#5D6877; --muted:#7A8596; --link:#1B4FD1; --focus:#1B68FA;
  --primary:#1B68FA; --blue-wash:rgba(27,104,250,.10); --blue-text:#1B4FD1;
  --green:#14AE5C; --green-text:#0D7A40; --green-wash:rgba(20,174,92,.12);
  --amber:#C47E09; --amber-text:#8A5A06; --amber-wash:rgba(240,179,94,.22);
  --red:#D73D3D; --red-text:#A82A2A; --red-wash:rgba(215,61,61,.10);
  --purple:#8E57FF; --purple-text:#6A35D6; --purple-wash:rgba(142,87,255,.12);
  --rd-tint:#EAF2FC; --val-tint:#EFE6FD; --code:#F4F6F9;
}}
:root[data-theme="light"]{
  color-scheme:light;
  --page:#F1F3F4; --rail:#F7F8FA; --rail-border:#E3E6EA; --card:#FFFFFF; --card-border:#E3E6EA; --pill:#F4F6F9; --pill-border:#D5DBE3; --hover:#EEF2F8; --row:#F7F9FC;
  --text:#0B1220; --text2:#2C3646; --label:#5D6877; --muted:#7A8596; --link:#1B4FD1; --focus:#1B68FA;
  --primary:#1B68FA; --blue-wash:rgba(27,104,250,.10); --blue-text:#1B4FD1;
  --green:#14AE5C; --green-text:#0D7A40; --green-wash:rgba(20,174,92,.12);
  --amber:#C47E09; --amber-text:#8A5A06; --amber-wash:rgba(240,179,94,.22);
  --red:#D73D3D; --red-text:#A82A2A; --red-wash:rgba(215,61,61,.10);
  --purple:#8E57FF; --purple-text:#6A35D6; --purple-wash:rgba(142,87,255,.12);
  --rd-tint:#EAF2FC; --val-tint:#EFE6FD; --code:#F4F6F9;
}
html,body{height:100%}
body{background:var(--page);color:var(--text);font:14px/1.45 var(--f-ui);overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--link)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr) 372px;height:100%}
.app.rail-min{grid-template-columns:64px minmax(0,1fr) 372px}
.app.agent-off{grid-template-columns:232px minmax(0,1fr) 0}
.app.rail-min.agent-off{grid-template-columns:64px minmax(0,1fr) 0}

/* rail */
.rail{background:var(--rail);border-right:1px solid var(--rail-border);display:flex;flex-direction:column;min-height:0;transition:background .3s}
.app[data-env="rd"] .rail{background:linear-gradient(180deg,var(--rd-tint),var(--rail) 70%)}
.app[data-env="val"] .rail{background:linear-gradient(180deg,var(--val-tint),var(--rail) 70%)}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 6px}
.brand svg{flex:none}
.brand b{font-weight:600;font-size:15px;letter-spacing:-.01em}
.appname{font:500 11px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--label);padding:0 16px 12px 52px}
.env{margin:4px 12px 12px;border:1px solid var(--pill-border);border-radius:12px;padding:4px;display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--card)}
.env button{border:0;background:transparent;border-radius:9px;padding:7px 6px;display:flex;gap:6px;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--label);cursor:pointer}
.env button[aria-pressed="true"]{background:var(--pill);color:var(--text)}
.env button[aria-pressed="true"].rd svg{color:var(--blue-text)}
.env button[aria-pressed="true"].val svg{color:var(--purple-text)}
.nav{overflow:auto;flex:1;padding:0 8px 12px}
.nav h6{font:500 11px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;color:var(--text2);text-decoration:none;font-size:13.5px}
.nav a:hover{background:var(--hover)}
.nav a{position:relative}
.nav a[aria-current="page"]{background:var(--pill);color:var(--text)}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:-8px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--primary)}
.nav a svg{flex:none;color:var(--label)}
.nav a .n{margin-left:auto;font:500 11px var(--f-mono);color:var(--label)}
.nav a .n.warn{background:var(--amber-wash);color:var(--amber-text);border-radius:8px;padding:0 6px}
.nav a .n.ok{color:var(--green-text)}
.user{border-top:1px solid var(--rail-border);padding:12px 16px;display:flex;gap:10px;align-items:center;font-size:12.5px}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#093AF6,#B080FC);display:grid;place-items:center;font-weight:600;font-size:11px;color:#fff;flex:none}
.app.rail-min .brand b,.app.rail-min .appname,.app.rail-min .env,.app.rail-min .nav h6,.app.rail-min .nav a span,.app.rail-min .nav a .n,.app.rail-min .user div{display:none}
.app.rail-min .nav a{justify-content:center}
.app.rail-min .nav-hint{display:none}
.app.rail-min .brand{flex-direction:column;align-items:center;padding:14px 0 8px;gap:10px}
.app.rail-min #railToggle{margin:0!important}
.app.rail-min .nav{padding-top:6px}
.app.rail-min .nav h6+a{margin-top:10px}
.app.rail-min .user{justify-content:center;padding:12px 0}
.app.rail-min .nav a .n.warn{display:none}
.rail{position:relative}

/* main */
.main{overflow:auto;min-width:0;grid-column:2;grid-row:1}
.rail{grid-column:1;grid-row:1} .agent{grid-column:3;grid-row:1}
.wrap{padding:22px max(16px,2.2vw) 60px;max-width:1240px}
.top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.eyebrow{font:400 12px var(--f-mono);color:var(--label);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h1{font:400 30px/1.15 var(--f-title);letter-spacing:-.01em;margin:6px 0 8px;text-wrap:balance}
h2{font:400 22px/1.2 var(--f-title);margin:0 0 4px;letter-spacing:-.01em}
h3{font:600 15px var(--f-ui);margin:0}
.sub{color:var(--label);max-width:72ch;margin:0}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{height:36px;border-radius:10px;padding:0 14px;border:1px solid var(--pill-border);background:var(--card);color:var(--text);font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-text)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--link)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--pill);border:1px solid var(--pill-border);color:var(--text2);white-space:nowrap}
.pill.green{background:var(--green-wash);border-color:transparent;color:var(--green-text)}
.pill.amber{background:var(--amber-wash);border-color:transparent;color:var(--amber-text)}
.pill.red{background:var(--red-wash);border-color:transparent;color:var(--red-text)}
.pill.purple{background:var(--purple-wash);border-color:transparent;color:var(--purple-text)}
.pill.blue{background:var(--blue-wash);border-color:transparent;color:var(--blue-text)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.demo{font:500 11px var(--f-mono);color:var(--amber-text);border:1px dashed var(--amber);border-radius:999px;padding:2px 9px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0 6px}
.kpi{background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:14px 16px}
.kpi .l{font:500 12px var(--f-ui);text-transform:uppercase;letter-spacing:.05em;color:var(--label)}
.kpi .v{font:500 28px var(--f-ui);font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:13px;color:var(--label)}
.card{background:var(--card);border:1px solid var(--card-border);border-radius:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--card-border);flex-wrap:wrap}
.card-b{padding:14px 16px}
.section{margin-top:22px}
.section-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.asset{padding:14px 16px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;border:1px solid var(--card-border);background:var(--card);border-radius:14px}
.asset:hover{background:var(--hover)}
.asset .top2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.asset .num{font:500 24px var(--f-ui);font-variant-numeric:tabular-nums}
.asset .what{color:var(--label);font-size:12.5px}
.muted{color:var(--muted)} .lab{color:var(--label)}
.mono{font-family:var(--f-mono);font-size:12px}
table{border-collapse:collapse;width:100%}
th{font:500 12px var(--f-ui);text-transform:uppercase;letter-spacing:.05em;color:var(--label);text-align:left;padding:9px 12px;border-bottom:1px solid var(--card-border);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--card-border);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--row)}
.scroll{overflow-x:auto}
.cite{display:inline-flex;align-items:center;gap:4px;font:500 11px var(--f-mono);color:var(--blue-text);background:var(--blue-wash);border-radius:6px;padding:1px 6px;cursor:help;border:0;white-space:nowrap;margin:1px 2px 1px 0}
.cite.agent{color:var(--purple-text);background:var(--purple-wash)}
.cite.you{color:var(--green-text);background:var(--green-wash)}
.tip{position:fixed;z-index:50;max-width:340px;background:var(--card);border:1px solid var(--pill-border);border-radius:10px;padding:10px 12px;box-shadow:0 8px 25px rgba(0,0,0,.35);font-size:12.5px;pointer-events:none}
.tip .d{font:500 11px var(--f-mono);color:var(--label);margin-bottom:4px}
.tip q{color:var(--text2)}
.flow{display:flex;gap:0;align-items:stretch;overflow-x:auto;padding:4px 2px}
.flow .st{min-width:140px;flex:1;padding:10px 12px;border:1px solid var(--card-border);background:var(--card);border-radius:12px;position:relative}
.flow .st small{display:block;color:var(--label);font-size:11.5px;margin-top:2px}
.flow .st .k{font:500 10.5px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.flow .ar{flex:none;width:22px;display:grid;place-items:center;color:var(--muted)}
.flow .st.blind{border-color:var(--purple);box-shadow:inset 0 0 0 1px var(--purple-wash)}

/* schedule matrix */
.soa th,.soa td{text-align:center;padding:8px 6px}
.soa th:first-child,.soa td:first-child{text-align:left;padding-left:14px;position:sticky;left:0;background:var(--card);z-index:1}
.soa .vh{font:600 12px var(--f-mono);color:var(--text);text-transform:none;letter-spacing:0}
.soa .vd{display:block;font:400 10.5px var(--f-mono);color:var(--label);text-transform:none;letter-spacing:0}
.cellb{width:34px;height:30px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;display:inline-grid;place-items:center;position:relative;font:600 11px var(--f-mono)}
.cellb:hover{border-color:var(--pill-border)}
.cellb.req{background:var(--blue-wash);color:var(--blue-text)}
.cellb.cond{background:var(--amber-wash);color:var(--amber-text);border:1px dashed var(--amber)}
.cellb.opt{color:var(--label);border:1px dashed var(--pill-border)}
.cellb.na{color:var(--muted);opacity:.35}
.cellb.edited::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--green)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--label);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:16px;height:12px;border-radius:4px;display:inline-block}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--pill-border);background:var(--card);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--text2)}
.chip[aria-pressed="true"]{background:var(--blue-wash);border-color:transparent;color:var(--blue-text);font-weight:600}

/* decisions */
.dec{border:1px solid var(--card-border);border-radius:14px;background:var(--card);overflow:hidden}
.dec+.dec{margin-top:12px}
.dec.open{border-color:var(--amber);box-shadow:inset 3px 0 0 var(--amber)}
.dec.done{box-shadow:inset 3px 0 0 var(--green)}
.dec-h{padding:14px 16px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.dec-b{padding:0 16px 16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.src{border:1px solid var(--card-border);border-radius:10px;padding:10px 12px;background:var(--row)}
.src .d{font:500 11px var(--f-mono);color:var(--label);margin-bottom:4px}
.src q{color:var(--text2);font-size:13px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--pill-border);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--card)}
.opt:hover{background:var(--hover)}
.opt input{margin-top:3px;accent-color:var(--primary)}
.opt .t{font-weight:600}
.opt .x{font-size:12.5px;color:var(--label)}
.rec{font:600 10.5px var(--f-ui);text-transform:uppercase;letter-spacing:.05em;color:var(--purple-text);background:var(--purple-wash);border-radius:6px;padding:1px 6px;margin-left:6px}
.impact{font-size:12.5px;color:var(--label);margin-top:6px}

/* form preview */
.fp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.fpane{background:#0A1426;border:1px solid var(--card-border);border-radius:14px;padding:16px;color:#E7EAF0}
:root[data-theme="light"] .fpane{background:#0A1426}
.fpane .ff{margin-bottom:14px}
.fpane label.fl{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
.fpane .desc{font-size:12px;color:#A3ACBA;margin:-2px 0 6px}
.fpane input[type=number],.fpane input[type=text],.fpane textarea,.fpane select{width:100%;background:#0E1A2B;border:1px solid #27395A;border-radius:8px;padding:7px 9px;color:#E7EAF0}
.fpane .ro{display:flex;gap:6px;flex-wrap:wrap}
.fpane .ro label{display:inline-flex;gap:6px;align-items:center;border:1px solid #27395A;border-radius:8px;padding:5px 9px;font-size:12.5px;cursor:pointer}
.fpane .ro input{accent-color:#2269E9}
.fpane .para{font:400 17px var(--f-title);border-bottom:1px solid #1E2F4A;padding-bottom:4px;margin:6px 0 12px}
.fpane .instr{background:rgba(76,124,240,.18);border:1px solid rgba(76,124,240,.4);border-radius:8px;padding:9px 11px;font-size:12.5px;color:#B4C8FF;margin-bottom:14px}
.fpane .err{color:#FF9B93;font-size:12px;margin-top:4px}
.fpane .req::after{content:" *";color:#FF9B93}
.fpane .hid{display:none}
pre.json{background:var(--code);border:1px solid var(--card-border);border-radius:12px;padding:12px 14px;font:12px/1.5 var(--f-mono);color:var(--text2);overflow:auto;max-height:520px;margin:0;white-space:pre}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--card-border);margin-bottom:14px;overflow-x:auto}
.tabs button{height:40px;border:0;background:none;color:var(--label);font-weight:600;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--primary)}

/* plan */
.op{display:grid;grid-template-columns:58px 64px minmax(0,1.3fr) minmax(0,1fr) 120px;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--card-border);font-size:13px}
.op:last-child{border-bottom:0}
.op .m{font:600 11px var(--f-mono);border-radius:6px;padding:2px 6px;text-align:center}
.m.POST{background:var(--green-wash);color:var(--green-text)} .m.PUT{background:var(--blue-wash);color:var(--blue-text)} .m.PATCH{background:var(--purple-wash);color:var(--purple-text)}
.op .e{font:12px var(--f-mono);color:var(--text2);overflow-wrap:anywhere}
.op .st{text-align:right;font-size:12px}
.op-g{padding:8px 14px;font:500 11px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--label);background:var(--row);border-bottom:1px solid var(--card-border)}
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.stp{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;border:1px solid var(--card-border);background:var(--card);font-size:13px;color:var(--label)}
.stp b{font:600 11px var(--f-mono);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--pill);color:var(--label)}
.stp.now{border-color:var(--primary);color:var(--text)} .stp.now b{background:var(--primary);color:#fff}
.stp.done{color:var(--green-text)} .stp.done b{background:var(--green-wash);color:var(--green-text)}
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:12px;padding:12px 14px;margin:12px 0;font-size:13.5px}
.banner.amber{background:var(--amber-wash);color:var(--amber-text)}
.banner.green{background:var(--green-wash);color:var(--green-text)}
.banner.purple{background:var(--purple-wash);color:var(--purple-text)}
.banner.blue{background:var(--blue-wash);color:var(--blue-text)}
.banner .grow{flex:1}

/* agent */
.agent{border-left:1px solid var(--rail-border);background:var(--rail);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ag-h{padding:14px 16px;border-bottom:1px solid var(--rail-border);display:flex;align-items:center;gap:10px}
.ag-h .orb{width:32px;height:32px;border-radius:50%;border:1px solid var(--pill-border);background:var(--card);color:var(--primary);display:grid;place-items:center;flex:none}
.ag-h b{font-weight:600}
.ag-h small{display:block;color:var(--label);font-size:11.5px}
.ag-body{flex:1;overflow:auto;padding:14px 14px 4px;display:flex;flex-direction:column;gap:12px}
.run{border:1px solid var(--card-border);border-radius:12px;background:var(--card)}
.run summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600}
.run summary::-webkit-details-marker{display:none}
.run ol{margin:0;padding:0 12px 10px 12px;list-style:none;display:flex;flex-direction:column;gap:6px}
.run li{display:grid;grid-template-columns:16px 1fr auto;gap:8px;font-size:12.5px;color:var(--text2);align-items:start}
.run li .tm{font:11px var(--f-mono);color:var(--muted)}
.run li svg{color:var(--green);margin-top:2px}
.msg{font-size:13.5px;line-height:1.5}
.msg.me{align-self:flex-end;background:var(--blue-wash);color:var(--text);border-radius:12px 12px 4px 12px;padding:8px 11px;max-width:88%}
.msg.ai{color:var(--text2)}
.msg.ai p{margin:0 0 8px}
.msg.ai ul{margin:0 0 8px;padding-left:18px}
.prop{border:1px solid var(--purple);border-radius:12px;padding:10px 12px;background:var(--purple-wash);margin-top:6px}
.prop .k{font:600 10.5px var(--f-ui);text-transform:uppercase;letter-spacing:.06em;color:var(--purple-text)}
.prop .acts{display:flex;gap:6px;margin-top:8px}
.sugs{display:flex;gap:6px;flex-wrap:wrap;padding:6px 14px}
.sug{border:1px solid var(--pill-border);background:var(--card);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--text2)}
.sug:hover{background:var(--hover)}
.ag-in{padding:10px 14px 14px;display:flex;gap:8px}
.ag-in input{flex:1;height:38px;border-radius:10px;border:1px solid var(--pill-border);background:var(--card);padding:0 12px}
.drop{border:1.5px dashed var(--pill-border);border-radius:14px;padding:18px;text-align:center;color:var(--label);display:flex;flex-direction:column;gap:6px;align-items:center}
.drop.over{border-color:var(--primary);background:var(--blue-wash)}
.modal{position:fixed;inset:0;background:rgba(3,8,16,.6);display:grid;place-items:center;z-index:60;padding:16px}
.modal .box{background:var(--card);border:1px solid var(--pill-border);border-radius:16px;width:min(520px,100%);padding:20px;max-height:90vh;overflow:auto}
.modal label{display:block;font-size:12.5px;color:var(--label);margin:12px 0 5px}
.modal select,.modal input,.modal textarea{width:100%;height:38px;border-radius:9px;border:1px solid var(--pill-border);background:var(--page);padding:0 10px}
.modal textarea{height:70px;padding:8px 10px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--pill-border);border-radius:10px;padding:9px 14px;font-size:13px;z-index:70;box-shadow:0 8px 25px rgba(0,0,0,.35)}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 12px;font-size:13px}
.kv dt{color:var(--label)} .kv dd{margin:0}
.iconbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--pill-border);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--label)}
.mobile-agent{display:none}
.app.agent-off .mobile-agent{display:inline-flex}
.hero{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;margin-top:18px}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.slot{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--card-border);border-radius:12px;padding:11px 12px;background:var(--row)}
.slot .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--pill);color:var(--label);flex:none}
.slot.got{border-color:transparent;background:var(--green-wash)} .slot.got .ic{background:transparent;color:var(--green-text)}
.slot .nm{font-weight:600;font-size:13px} .slot .hint{font-size:12px;color:var(--label)} .slot .fn{font:11.5px var(--f-mono);color:var(--green-text);overflow-wrap:anywhere}
.bigdrop{border:1.5px dashed var(--pill-border);border-radius:14px;padding:22px 18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.bigdrop.over{border-color:var(--primary);background:var(--blue-wash)}
.bigdrop .glyph{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--blue-wash);color:var(--blue-text);flex:none}
.way{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--card-border);text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%;cursor:pointer}
.way:last-child{border-bottom:0} .way:hover:not([disabled]){background:var(--hover)} .way[disabled]{cursor:not-allowed;opacity:.55}
.way .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--pill);color:var(--label);flex:none}
.tpls{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.steps4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.step4{padding:14px 16px}
.step4 .k{font:500 11px var(--f-mono);color:var(--muted)}
.empty-row{padding:26px 16px;text-align:center;color:var(--label)}
.prog{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.prog div{display:grid;grid-template-columns:18px 1fr auto;gap:8px;font-size:13px;color:var(--label);align-items:center}
.prog div.ok{color:var(--text2)} .prog div.ok svg{color:var(--green)} .prog div.cur{color:var(--text)} .prog div.cur svg{color:var(--blue-text)}
@media (max-width:1180px){.hero{grid-template-columns:minmax(0,1fr)} .steps4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.slots,.steps4{grid-template-columns:minmax(0,1fr)}}
@media (max-width:1180px){
  .app,.app.rail-min{grid-template-columns:64px minmax(0,1fr) 0}
  .app:not(.rail-min) .rail{position:fixed;left:0;top:0;bottom:0;width:232px;z-index:45;box-shadow:10px 0 30px rgba(0,0,0,.28)}
  .agent{position:fixed;right:0;top:0;bottom:0;width:min(380px,100%);z-index:40;transform:translateX(100%);transition:transform .2s;box-shadow:-10px 0 30px rgba(0,0,0,.4)}
  .app.agent-open .agent{transform:none}
  .mobile-agent{display:inline-flex}
  .kpis,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .app,.app.rail-min{grid-template-columns:minmax(0,1fr)}
  .main{grid-column:1}
  .rail{position:fixed;left:0;right:0;bottom:0;top:auto;height:56px;flex-direction:row;z-index:30;border-right:0;border-top:1px solid var(--rail-border)}
  .brand,.appname,.env,.user,.nav h6{display:none!important}
  .nav{display:flex;flex-direction:row;overflow-x:auto;padding:6px}
  .main{padding-bottom:56px}
  .grid2,.grid3,.dec-b,.fp{grid-template-columns:minmax(0,1fr)}
  .op{grid-template-columns:48px 54px minmax(0,1fr);}
  .op .t2,.op .st{grid-column:3}
  .wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  h1{font-size:25px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.gsel{font:400 12px var(--f-mono);border:1px solid var(--pill-border);border-radius:6px;background:var(--card);padding:1px 4px}

/* mini JSON Logic */
function jl(r,d){ if(r===null||typeof r!=='object') return r; if(Array.isArray(r)) return r.map(x=>jl(x,d));
  const op=Object.keys(r)[0], a=[].concat(r[op]); const v=i=>jl(a[i],d);
  switch(op){case 'var':return d[a[0]]??null;case '==':return v(0)==v(1);case '!=':return v(0)!=v(1);case '>':return v(0)>v(1);case '>=':return v(0)>=v(1);case '<':return v(0)<v(1);case '<=':return v(0)<=v(1);
   case 'and':return a.every((_,i)=>v(i));case 'or':return a.some((_,i)=>v(i));case '!':return !v(0);case 'in':{const h=v(1);return Array.isArray(h)||typeof h==='string'?h.includes(v(0)):false}
   case 'length':{const x=v(0);return x==null?0:String(x).length}default:return null}}
const isVis=(f,d)=>f.visible===undefined||f.visible===true?true:f.visible===false?false:f.visible.some(r=>!!jl(r,d));
const isReq=(f,d)=>f.requiredWhenVisible===true?true:Array.isArray(f.requiredWhenVisible)?f.requiredWhenVisible.some(r=>!!jl(r,d)):false;

  TEAM.filter(t=>t.kind==='Role').forEach(r=>P('Roles and pools','POST','/api/roles',`Role · ${r.name}`,{label:r.name,actions:r.perm}));
  TEAM.filter(t=>t.kind!=='Role').forEach(r=>P('Roles and pools','POST','/api/staffing_pools',`Pool · ${r.name}`,{label:r.name,members:[]},true));
  P('Roles and pools','POST','/api/projects/{bicr}/permissions','Grant reader and adjudicator roles on BICR',{roles:['BICR Reader','BICR Adjudicator']});

V.reads = ()=>{

  const fieldHtml = f.fields.map(x=>{

    if(S.formChecked&&vis){ const val=d[x.key]; const empty=val==null||val===''||(Array.isArray(val)&&!val.length);
      if(req&&empty) err='This is a required question.'; else if(!empty&&x.validation){const bad=x.validation.find(r=>!jl(r.logic,d)); if(bad) err=bad.message;} }
    const wrap=c=>`<div class="ff ${vis?'':'hid'}">${c}${err?`<div class="err">${esc(err)}</div>`:''}</div>`;
    if(x.type==='paragraph') return `<div class="para ${vis?'':'hid'}">${esc(x.label)}</div>`;
    if(x.type==='instruction') return `<div class="instr ${vis?'':'hid'}"><b>${esc(x.label)}.</b> ${esc(x.description)}</div>`;
    const lab=`<label class="fl ${req?'req':''}" for="f_${x.key}">${esc(x.label)}</label>`;
    if(x.type==='radio') return wrap(`<div class="fl ${req?'req':''}" style="font-weight:600;font-size:13px;margin-bottom:5px">${esc(x.label)}</div><div class="ro" role="radiogroup" aria-label="${esc(x.label)}">${x.options.map(o=>`<label><input type="radio" name="f_${x.key}" data-fk="${x.key}" value="${o.value}" ${d[x.key]===o.value?'checked':''}>${esc(o.label||o.value)}</label>`).join('')}</div>`);

    return wrap(lab+`<input type="text" id="f_${x.key}" data-fk="${x.key}" value="${esc(d[x.key]||'')}">`);
  }).join('');

document.addEventListener('click',e=>{

    const [tp,v]=t.dataset.cell.split('|'); const cur=cellState(tp,v); const order=['req','cond','opt','na']; const next=order[(order.indexOf(cur)+1)%4];
    const saved=S.edits[t.dataset.cell]; delete S.edits[t.dataset.cell]; const derived=cellState(tp,v); if(next!==derived) S.edits[t.dataset.cell]=next; void saved;
    resetRun(); render(); agentSay(`<p>Recorded: <b>${TEMPLATES.find(x=>x.id===tp).label}</b> at <b>${v}</b> is now <b>${next}</b>. This differs from the SoA, so it is listed as a manual edit in the spec and the trace drops below 100%.</p>`); return;}

    const left=openDecs().length; if(!left) agentSay('<p>All six decisions are recorded. The build plan is ready for a dry run in R&amp;D.</p>',[['Open build plan','plan']]); return;}
  if(t.dataset.undo){ delete S.dec[t.dataset.undo]; resetRun(); render(); go('decisions',t.dataset.undo); return;}
  if(t.dataset.ask){ ask('why '+t.dataset.ask); return;}

  if(t.dataset.copy){ const s=JSON.stringify(buildProtocol(),null,2); navigator.clipboard?.writeText(s).then(()=>toast('Copied protocol JSON'),()=>toast('Copy blocked here. Select the JSON and copy.')); return;}
  if(t.dataset.preview){ const p=buildPlan().find(x=>x.id===t.dataset.preview); modal(`<div class="eyebrow">${p.id} · ${p.g}</div><h2 style="margin:6px 0 4px">${esc(p.t)}</h2><p class="mono lab" style="margin:0 0 10px">${p.m} ${esc(p.e)}</p><pre class="json" style="max-height:50vh">${esc(JSON.stringify(p.body,null,2))}</pre><div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn" data-act="close">Close</button></div>`); return;}
  if(t.dataset.prop){ applyProposal(t.dataset.prop); return; }
  const a=t.dataset.act; if(!a) return;
  if(a==='close'){closeModal();return;}

  if(a==='dryrun') return dryRun();
  if(a==='verify'){ S.verified=true; render(); agentSay(`<p>Read back all ${buildPlan().length} assets from R&amp;D and compared them field by field with the spec. <b>0 differences.</b></p><p>Two endpoints are marked (verify) because their shapes are inferred; the dry run proves them only against this sandbox build.</p>`); return;}
  if(a==='sign') return modal(`<div class="eyebrow">21 CFR Part 11 · electronic signature</div><h2 style="margin:6px 0 4px">Sign setup spec v1.0</h2><p class="lab" style="margin:0">Locks the configuration. Later changes need an amendment with a reason, a new dry run and a new signature.</p>
    <dl class="kv" style="margin-top:12px"><dt>Fingerprint</dt><dd class="mono">${fingerprint()}</dd><dt>Operations</dt><dd>${buildPlan().length}</dd><dt>Decisions</dt><dd>${DECISIONS.length} recorded</dd><dt>Manual edits</dt><dd>${Object.keys(S.edits).length}</dd></dl>
    <label for="sreason">Reason for signature</label><select id="sreason"><option>Approved for study start</option><option>Approved for UAT</option></select>
    <label for="smfa">MFA passcode</label><input id="smfa" inputmode="numeric" placeholder="6-digit code (any value in this demo)">
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="dosign">Sign</button></div>`);
  if(a==='dosign'){ S.signed={reason:$('#sreason').value,at:now(),fp:fingerprint()}; closeModal(); render(); toast('Spec v1.0 signed and locked'); agentSay('<p>Spec v1.0 is locked. Next: promote it to Validated. I will run a preflight there first (installed gears, group, roles) before anything is written.</p>',[['Switch to Validated','__val']]); return;}
  if(a==='toval'){ setEnv('val'); return;}
  if(a==='preflight'){ S.promote.state='preflight'; render(); return;}
  if(a==='installgear'){ S.promote.state='ready'; render(); toast('Preflight clean'); return;}

});

  const tick=()=>{ if(i>0) S.run.done[ops[i-1].id]='ok'; if(i<ops.length){S.run.done[ops[i].id]='run'; i++; render(); setTimeout(tick,55);} else {S.run.state='done'; S.promote.state='done'; render(); toast('Live on Validated'); agentSay('<p>Applied spec v1.0 to Validated and read it back: no drift. The build record (spec, decisions, dry-run and apply logs) is ready for the validation file.</p>');} };
  tick(); }
function showSpec(){ const spec={spec_version:'1.0',status:S.signed?'signed':'draft',fingerprint:fingerprint(),signed:S.signed||null,sources:SOURCES.map(s=>s.name),decisions:DECISIONS.map(d=>({id:d.id,choice:S.dec[d.id]||null,by:S.decBy?.[d.id]||null})),manual_edits:S.edits,operations:buildPlan().map(o=>({id:o.id,method:o.m,endpoint:o.e,summary:o.t}))};
  modal(`<div class="eyebrow">Setup spec · ${S.signed?'signed':'draft'}</div><h2 style="margin:6px 0 10px">NVX-301 setup spec v1.0</h2><pre class="json" style="max-height:56vh">${esc(JSON.stringify(spec,null,2))}</pre><div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn" data-act="close">Close</button></div>`); }

function startDraft(){ S.drafting=0; render(); const tick=()=>{ S.drafting++; if(S.drafting<=RUN.length){ render(); setTimeout(tick,420);} else { S.drafting=-1; go('overview'); toast('Draft ready'); } }; setTimeout(tick,420); }
function bindBigDrop(){ const d=$('#bigdrop'); if(!d) return; const add=files=>{ const left=[]; [...files].forEach(f=>{ const sl=SLOTS.find(x=>!S.slots[x.id]&&x.re.test(f.name)); if(sl) S.slots[sl.id]=f.name; else left.push(f.name); }); render();
    agentSay(`<p>Matched ${files.length-left.length} of ${files.length} file${files.length>1?'s':''} to slots by name.${left.length?` I couldn't place: <span class="mono">${left.map(esc).join(', ')}</span>. Rename them or tell me what they are.`:''}</p><p class="lab" style="font-size:12.5px">This prototype matches by filename only; drafting always uses the NVX-301 sample.</p>`); };
  d.addEventListener('dragover',e=>{e.preventDefault();d.classList.add('over')}); d.addEventListener('dragleave',()=>d.classList.remove('over'));
  d.addEventListener('drop',e=>{e.preventDefault();d.classList.remove('over');add(e.dataTransfer.files)}); $('#bigfile').addEventListener('change',e=>add(e.target.files)); }
function agentBlank(){
  $('#agBody').innerHTML=`<div class="msg ai"><p><b>Hi Dan.</b> I set up trials in Flywheel from your study documents.</p>
   <p>Add the <b>imaging charter</b> and the <b>protocol or schedule of assessments</b>, plus the read manual and any form definitions you have. I'll draft the arms, visits, session templates, read protocol, forms and gear rules, and point out where the documents disagree.</p>
   <p class="lab" style="font-size:12.5px">I only propose. You review everything, and nothing is written to Flywheel until you run the build plan.</p></div>`;
  setSugs(['What documents do you need?','Can I start without a charter?','What gets created in Flywheel?']);
}
/* tooltips for citations */
const tip=$('#tip');
document.addEventListener('mouseover',e=>{const c=e.target.closest('[data-cite]'); if(!c){tip.hidden=true;return;} const d=CITES[c.dataset.cite]; tip.innerHTML=`<div class="d">${esc(d.doc)} · ${esc(d.loc)}</div><q>${esc(d.q)}</q>`; tip.hidden=false; const r=c.getBoundingClientRect(); tip.style.left=Math.min(r.left,window.innerWidth-360)+'px'; tip.style.top=(r.bottom+6)+'px';});
document.addEventListener('focusin',e=>{const c=e.target.closest('[data-cite]'); if(c) c.dispatchEvent(new MouseEvent('mouseover',{bubbles:true}));});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();tip.hidden=true;$('#app').classList.remove('agent-open');}});

/* upload (demo) */
function bindDrop(){ const d=$('#drop'); if(!d) return; const add=files=>{[...files].forEach(f=>SOURCES.push({id:'U'+SOURCES.length,name:f.name,kind:'Uploaded (demo)',size:Math.round(f.size/1024)+' KB',got:'Not parsed in this prototype. In the product the agent extracts and diffs it against the current spec.',n:'—',uploaded:true})); render(); agentSay(`<p>Received ${files.length} file${files.length>1?'s':''}. In the product I would extract it, diff it against spec v1.0 and open an amendment if anything changes. This prototype does not parse uploads.</p>`);};
  d.addEventListener('dragover',e=>{e.preventDefault();d.classList.add('over')}); d.addEventListener('dragleave',()=>d.classList.remove('over'));
  d.addEventListener('drop',e=>{e.preventDefault();d.classList.remove('over');add(e.dataTransfer.files)}); $('#file').addEventListener('change',e=>add(e.target.files)); }

/* ============ AGENT (scripted; not an LLM) ============ */
const RUN = [['Read Imaging Charter v2.0 (48 pp)','31 items','0:42'],['Read Protocol Amd 2 SoA excerpt','14 items','0:18'],['Read IRC Read Manual v1.1','12 items','0:27'],['Parsed V3 form JSON (22 fields)','valid schema','0:01'],['Parsed REDCap data dictionary','2 instruments','0:01'],['Cross-checked sources','6 conflicts or gaps','0:09'],['Checked Flywheel R&D site capabilities','gears, roles, group','0:04'],['Drafted build plan','ops ready','0:03']];
function agentInit(){
  $('#agBody').innerHTML = `<details class="run" open><summary><span>${ico('check',13)} Read 5 sources, drafted setup</span><span class="mono lab">1:45</span></summary><ol>${RUN.map(r=>`<li>${ico('check',12)}<span>${r[0]} <span class="lab">· ${r[1]}</span></span><span class="tm">${r[2]}</span></li>`).join('')}</ol></details>
  <div class="msg ai"><p>I built a draft setup for <b>NVX-301</b>: two projects (Intake and blinded BICR), ${VISITS.length} visits across 3 arms, ${TEMPLATES.length} session templates, a RECIST 1.1 read protocol with adjudication, ${GEARS.length} gear rules, and roles and pools.</p>
  <p><b>6 things need your call.</b> The biggest: the protocol and the charter disagree on the visit window (±7 vs ±3 days), and the supplied form caps target lesions at 3 when RECIST allows 5.</p>
  <p class="lab" style="font-size:12.5px">Every value links to the sentence it came from. Hover a blue chip to see it.</p></div>`;
  setSugs(['What is still blocking the build?','Why ±7 days?','Add a bone scan at end of treatment','How do readers stay blinded?']);
}
function setSugs(list){ $('#sugs').innerHTML=list.map(s=>`<button class="sug" type="button">${esc(s)}</button>`).join(''); $('#sugs').querySelectorAll('.sug').forEach(b=>b.onclick=()=>ask(b.textContent)); }
function agentSay(html,links){ const m=document.createElement('div'); m.className='msg ai'; m.innerHTML=html+(links?`<div class="chips">${links.map(([l,v])=>`<button class="chip" ${v==='__val'?'data-act="toval"':`data-go="${v}"`}>${l}</button>`).join('')}</div>`:''); $('#agBody').appendChild(m); $('#agBody').scrollTop=1e9; }
function ask(q){
  const me=document.createElement('div'); me.className='msg me'; me.textContent=q; $('#agBody').appendChild(me);
  if(window.innerWidth<=1180) $('#app').classList.add('agent-open');
  const s=q.toLowerCase(); let html, links;
  if(/documents do you need|what documents/.test(s)){ html='<p>Minimum: the <b>imaging charter</b> and the <b>protocol or SoA</b>. Better: add the <b>read manual</b> (reader model, adjudication, criteria rules) and <b>form definitions</b> (Flywheel V3 JSON, REDCap data dictionary CSV, or ODM-XML (verify)). Use locked, approved versions; each value I draft cites a page.</p>'; }
  else if(/without a charter/.test(s)){ html='<p>Yes. Retrospective studies often have only a protocol or a statistical analysis plan. I will draft what I can and list the gaps (blinding, acquisition parameters, QC rules) as open decisions instead of guessing.</p>'; }
  else if(/what gets created/.test(s)){ html='<p>In the R&amp;D sandbox first: projects, trial and visit schedule, session templates, a de-identification profile, gear rules, the read protocol, eCRF definitions, roles, staffing pools, tags and a data view. You see every API call before it runs.</p>'; }
  else if(s.startsWith('why d')){ const d=DECISIONS.find(x=>x.id===q.slice(4).toUpperCase()); const r=d.opts.find(o=>o.rec);
    html=`<p><b>${d.id}: I recommend "${esc(r.t)}".</b></p><p>${esc(r.x)}</p><p>Evidence: ${cite(d.c)}</p><p class="lab" style="font-size:12.5px">You make the call; I only record it.</p>`; }
  else if(/block|left|remaining|status/.test(s)){ const o=openDecs();
    html = o.length?`<p>${o.length} decision${o.length>1?'s':''} block the dry run:</p><ul>${o.map(d=>`<li><b>${d.id}</b> ${esc(d.title)}</li>`).join('')}</ul><p>Two gear rules depend on gears that are not in the Exchange (imaging-qc-check, reader-task-creator). They do not block the dry run in R&amp;D, but Validated needs them installed.</p>`:
      S.signed?`<p>Nothing blocks. Spec v1.0 is ${S.promote.state==='done'?'live on Validated':'signed; promote it to Validated next'}.</p>`:`<p>Nothing blocks the dry run. Run it from the build plan.</p>`; links=[[o.length?'Open decisions':'Open build plan',o.length?'decisions':'plan']]; }
  else if(/7|window/.test(s)){ html=`<p>The protocol SoA gives ±7 days ${cite(['C3'])} and the charter gives ±3 ${cite(['C2'])}. The charter itself says the protocol wins on conflicts ${cite(['C1'])}, so I recommend ±7 and a note to amend the charter.</p>`; links=[['Decide D1','decisions']]; }
  else if(/bone|eot|end of treatment/.test(s)){ html=`<p>The charter allows a bone scan when clinically indicated ${cite(['C15'])}, which is why it is <i>optional</i> at EOT today. Making it <b>required</b> at EOT goes beyond the charter.</p><div class="prop"><div class="k">Proposed change</div><div>Bone scan at <b>EOT</b>: optional → required. Recorded as a manual edit with you as author.</div><div class="acts"><button class="btn sm primary" data-prop="bone-eot">Apply</button><button class="btn sm" data-go="schedule">See schedule</button></div></div>`; }
  else if(/blind/.test(s)){ html=`<p>Four layers ${cite(['C11'])}:</p><ul><li>Readers have roles only on the BICR project, which never receives arm, site or scan dates.</li><li>The de-id gear shifts dates per participant ${cite(['C18'])}.</li><li>The viewer hides the tag browser; labels are fixed to TL, NTL and NL.</li><li>The Reader Portal shows only assigned tasks, without labels.</li></ul><p>Open risk: DICOM headers the profile misses. Have QA run a header scan on the first BICR copies.</p>`; }
  else if(/slice|thick/.test(s)){ html=`<p>Charter: ≤5 mm required, ≤2.5 mm recommended ${cite(['C4'])}. A template rule only passes or fails, so I put the 5 mm limit in the template and the 2.5 mm warning in the QC gear.</p>`; links=[['Decide D2','decisions']]; }
  else if(/adjud/.test(s)){ html=`<p>The manual triggers adjudication on best overall response or progression timepoint ${cite(['C8'])}. Those span visits, and Flywheel triggers per task, so the closest match is a per-timepoint overall_response trigger. It adjudicates more often than the manual requires.</p>`; links=[['Decide D5','decisions']]; }
  else { html=`<p>This prototype answers a few scripted questions: what's blocking the build, the visit window, slice thickness, adjudication, blinding, or adding a bone scan at EOT. In the product this is the Loka agent working through the Application MCP, with read-only tools and propose → preview → approve for changes.</p>`; }
  setTimeout(()=>agentSay(html,links),280);
}
function applyProposal(id){ if(S.signed){toast('Setup is locked. Changes need an amendment.');return;}
  if(id==='bone-eot'){ S.edits['BONE|EOT']='req'; resetRun(); render(); toast('Bone scan required at EOT'); agentSay('<p>Applied. Bone scan at EOT is now required, marked as your edit. The dry run must be repeated.</p>',[['See schedule','schedule']]); } }
$('#agForm').addEventListener('submit',e=>{e.preventDefault(); const v=$('#agInput').value.trim(); if(!v) return; $('#agInput').value=''; ask(v);});
$('#agentClose').onclick=()=>{ if(window.innerWidth<=1180) $('#app').classList.remove('agent-open'); else $('#app').classList.add('agent-off'); toast('Agent hidden. Use the Agent button to reopen.'); addAgentBtn(); };
function addAgentBtn(){}
const mqN=matchMedia('(max-width:1180px)');
function syncRail(){ $('#app').classList.toggle('rail-min', mqN.matches); railLabel(); }
function railLabel(){ const m=$('#app').classList.contains('rail-min'); $('#railToggle').setAttribute('aria-label',m?'Expand navigation':'Collapse navigation'); $('#railToggle').title=m?'Expand navigation':'Collapse navigation'; }
mqN.addEventListener('change',syncRail); syncRail();
$('#railToggle').onclick=()=>{ $('#app').classList.toggle('rail-min'); railLabel(); };
document.addEventListener('click',e=>{ if(mqN.matches && !$('#app').classList.contains('rail-min') && (e.target.closest('.nav a') || !e.target.closest('.rail'))){ $('#app').classList.add('rail-min'); railLabel(); } });
document.addEventListener('click',e=>{ if(e.target.closest('[data-act="agent"]')) $('#app').classList.remove('agent-off'); });

/* boot */
S.calls=[]; S.live=null;
function liveChip(){ return S.live?`<span class="livechip">Live · ${esc(S.live.site)} · read-only</span>`:''; }
function groupPicker(){ if(!S.live||!S.live.groups.length) return 'novexa-nvx301'; return `<select class="gsel" id="gsel" aria-label="Group">${S.live.groups.map(g=>`<option>${esc(g._id||g.id)}</option>`).join('')}</select>`; }
V.diag=()=>header('Harness','Diagnostics','Every API call this harness made through the extension SDK. Harness only; not part of the product app.')+
  `${S.liveErr?`<div class="banner amber"><div class="grow"><b>SDK not connected.</b> ${esc(S.liveErr)}</div></div>`:''}
  <div class="section card scroll"><table><thead><tr><th>Call</th><th>Status</th><th>ms</th><th>Sample</th></tr></thead><tbody>
  ${S.calls.map(c=>`<tr><td class="mono">${c.m} ${esc(c.path)}</td><td>${c.ok?'<span class="pill green">ok</span>':'<span class="pill red">error</span>'}</td><td class="mono">${c.ms}</td><td class="mono lab" style="max-width:520px;overflow-wrap:anywhere">${esc(c.ok?c.sample:c.err)}</td></tr>`).join('')||'<tr><td colspan="4" class="lab">No calls yet.</td></tr>'}</tbody></table></div>
  <dl class="kv section"><dt>Build</dt><dd class="mono">trial-builder harness v1 · extension SDK 0.14.9</dd><dt>In frame</dt><dd>${window.parent!==window}</dd></dl>`;
async function api(m,path,params){ const t0=performance.now(); try{ const r=await S.ext.apiRequest(m,path,params); S.calls.push({m,path,ok:true,ms:Math.round(performance.now()-t0),sample:JSON.stringify(Array.isArray(r)?r[0]:(r&&r.results?r.results[0]:r)).slice(0,280)}); return r; }
  catch(e){ S.calls.push({m,path,ok:false,ms:Math.round(performance.now()-t0),err:String(e&&e.message||e)}); throw e; } }
async function connect(){
  if(window.parent===window) return;
  if(!window.Flywheel){ S.liveErr='Extension SDK failed to load from cdn.flywheel.io.'; render(); return; }
  try{
    S.ext=await Flywheel.initExtension({scope:'ReadWrite',validateOrigin:o=>/^https:\/\/[a-z0-9.-]+\.flywheel\.io$/.test(o)});
    const me=await api('GET','/api/users/self');
    let groups=[]; try{ const g=await api('GET','/api/groups'); groups=Array.isArray(g)?g:(g.results||[]); }catch(_){}
    let site='flywheel'; try{ site=new URL(document.referrer).host.split('.')[0]; }catch(_){}
    S.live={site,user:me,groups};
    const nm=[me.firstname,me.lastname].filter(Boolean).join(' ')||me.email||me._id;
    $('#uName').textContent=nm; $('#uAv').textContent=nm.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();
    render(); toast('Connected to '+site+' as '+nm);
  }catch(e){ S.liveErr=String(e&&e.message||e); render(); }
}
document.addEventListener('pointerdown',()=>{ if(S.ext&&!S.fsTried&&!document.fullscreenElement){ S.fsTried=1; document.documentElement.requestFullscreen?.().catch(()=>{}); } });
S.view = V[location.hash.slice(1)]?location.hash.slice(1):'start'; S.mode=S.view==='start'?'blank':'trial';
if(S.mode==='blank') agentBlank(); else agentInit(); render(); connect();
</script>
